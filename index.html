<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>จองห้องเรียน</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bai+Jamjuree:wght@500;600;700&family=IBM+Plex+Sans+Thai:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: door-placard app; sticky bar with tabs, single column; room view = placard + timeline + booking form */
:root{
  --bg:#EEF2F3; --surface:#FFFFFF; --ink:#14222A; --muted:#586972; --line:#D5DDE0;
  --accent:#0D6662; --accent-ink:#FFFFFF; --accent-soft:#D3EAE8;
  --free:#1C7F47; --free-soft:#DCEFE3; --busy:#B93B28; --busy-soft:#F6DDD7; --wait:#9A6400; --wait-soft:#F5E7C8;
  --mine:#2F55B5; --mine-soft:#DDE5F7; --plate:#14222A; --plate-ink:#EEF2F3;
  --f-display:"Bai Jamjuree","IBM Plex Sans Thai",system-ui,sans-serif;
  --f-body:"IBM Plex Sans Thai",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root{
  --bg:#0D1518; --surface:#162126; --ink:#E4ECEE; --muted:#91A3AB; --line:#283840;
  --accent:#4DBDB5; --accent-ink:#04201E; --accent-soft:#123634;
  --free:#5CCB8A; --free-soft:#123020; --busy:#EE806B; --busy-soft:#3A1F1A; --wait:#E8B95A; --wait-soft:#33280F;
  --mine:#8AA8F2; --mine-soft:#1C2848; --plate:#E4ECEE; --plate-ink:#0D1518; color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.55}
h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance;line-height:1.2}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.bar{position:sticky;top:0;z-index:5;background:var(--surface);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top,0px)}
.wrap{max-width:900px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.bar .wrap{display:flex;align-items:center;gap:12px 16px;padding-block:10px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--f-display);font-weight:700;font-size:18px}
.brand .mark{width:28px;height:28px;border-radius:6px;background:var(--plate);display:grid;place-items:center}
.brand .mark svg{width:18px;height:18px}
.tabs{display:flex;gap:4px;margin-left:auto;overflow-x:auto;max-width:100%}
.tab{border:0;background:none;padding:7px 12px;border-radius:999px;cursor:pointer;color:var(--muted);font-weight:500;white-space:nowrap}
.tab[aria-current="page"]{background:var(--accent-soft);color:var(--ink)}
.tab:hover{color:var(--ink)}
main.wrap{padding-block:24px 64px;display:flex;flex-direction:column;gap:20px}
.head{display:flex;align-items:end;justify-content:space-between;gap:12px;flex-wrap:wrap}
.head h1{font-size:26px}
.sub{color:var(--muted);margin:4px 0 0}
.eyebrow{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600}
.rooms{display:flex;flex-direction:column;gap:12px}
.room{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;display:grid;grid-template-columns:1fr auto;gap:10px 16px;cursor:pointer;text-align:left;width:100%}
.room:hover{border-color:var(--accent)}
.room .meta{min-width:0}
.room h3{font-size:18px}
.facts{color:var(--muted);font-size:13px}
.room .tl{grid-column:1/-1}
.chip{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:999px;font-size:13px;font-weight:600;white-space:nowrap;align-self:start}
.chip::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.chip.free{background:var(--free-soft);color:var(--free)}
.chip.busy{background:var(--busy-soft);color:var(--busy)}
.chip.wait{background:var(--wait-soft);color:var(--wait)}
.chip.mute{background:var(--bg);color:var(--muted)}
.tl .track{position:relative;height:22px;border-radius:6px;background:var(--bg);border:1px solid var(--line);overflow:hidden}
.tl .blk{position:absolute;top:0;bottom:0;background:var(--busy);opacity:.85}
.tl .blk.in{background:var(--accent)}
.tl .blk.mine{background:var(--mine)}
.tl .now{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--ink)}
.tl .ticks{position:relative;height:16px;font-family:var(--f-mono);font-size:10.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.tl .ticks span{position:absolute;transform:translateX(-50%);top:2px}
.tl.big .track{height:44px;border-radius:8px;cursor:pointer}
.tl.big .blk{border-left:2px solid var(--surface)}
.placard{background:var(--plate);color:var(--plate-ink);border-radius:14px;padding:20px;display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;align-items:flex-start}
.placard h1{font-size:30px}
.placard .facts{color:inherit;opacity:.75;font-size:14px}
.back{border:0;background:none;color:var(--accent);cursor:pointer;padding:0;font-weight:600;align-self:flex-start}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px;display:flex;flex-direction:column;gap:14px;min-width:0}
.panel h2{font-size:18px}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:end}
.field{display:flex;flex-direction:column;gap:4px;min-width:0;flex:1 1 140px}
.field label{font-size:13px;color:var(--muted);font-weight:500}
.field input,.field select{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:9px 10px;width:100%;min-width:0}
.field input:focus,.field select:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px var(--accent-soft)}
.btn{border:0;border-radius:8px;padding:10px 16px;font-weight:600;cursor:pointer;background:var(--accent);color:var(--accent-ink);white-space:nowrap}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.ghost{background:none;color:var(--ink);border:1px solid var(--line)}
.btn.small{padding:6px 12px;font-size:13px}
.btn.danger{background:none;color:var(--busy);border:1px solid var(--line);padding:6px 12px;font-size:13px}
.msg{font-size:14px;padding:10px 12px;border-radius:8px}
.msg.ok{background:var(--free-soft);color:var(--free)}
.msg.err{background:var(--busy-soft);color:var(--busy)}
.msg.info{background:var(--accent-soft)}
.list{display:flex;flex-direction:column}
.item{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.item:first-child{border-top:0}
.time{font-family:var(--f-mono);font-size:13px;font-variant-numeric:tabular-nums;white-space:nowrap}
.what{min-width:0}
.what b{display:block;font-weight:600;overflow-wrap:anywhere}
.what small{color:var(--muted)}
.item.mine .time{color:var(--mine)}
.acts{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.empty{color:var(--muted);padding:8px 0}
.legend{display:flex;gap:14px;font-size:12px;color:var(--muted);flex-wrap:wrap}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.filters{display:flex;gap:6px;flex-wrap:wrap}
.fchip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px;cursor:pointer;font-size:13px;color:var(--muted)}
.fchip[aria-pressed="true"]{background:var(--plate);color:var(--plate-ink);border-color:var(--plate)}
.tag{display:inline-block;font-size:11.5px;font-weight:600;padding:1px 8px;border-radius:999px;background:var(--accent-soft);margin-right:6px;vertical-align:1px}
.equip{font-size:12.5px;color:var(--muted)}
.confirm{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:13px}
.qrgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px}
.qrcard{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:10px;align-items:center;text-align:center}
.qrbox{background:#FFFFFF;padding:10px;border-radius:8px;line-height:0}
.qrbox img,.qrbox canvas{width:150px;height:150px;image-rendering:pixelated}
.tablewrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{text-align:left;padding:9px 10px;border-top:1px solid var(--line);white-space:nowrap}
th{font-size:12px;color:var(--muted);font-weight:600;border-top:0}
td.mono{font-family:var(--f-mono);font-size:13px}
.modal{position:fixed;inset:0;background:rgba(10,18,22,.6);z-index:30;display:grid;place-items:center;padding:16px}
.sheet{background:var(--surface);border-radius:16px;padding:22px;width:min(420px,100%);display:flex;flex-direction:column;gap:14px;align-items:center;text-align:center;max-height:100%;overflow:auto}
.sheet .qrbox img,.sheet .qrbox canvas{width:260px;height:260px;max-width:100%}
.sheet.wide{width:min(640px,100%);align-items:stretch;text-align:left}
.sheet-head{display:flex;justify-content:space-between;align-items:start;gap:12px}
.xbtn{border:0;background:none;cursor:pointer;font-size:22px;line-height:1;color:var(--muted);padding:2px 6px}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:end}
.toolbar .field{flex:1 1 220px}
.stats{display:flex;gap:18px;flex-wrap:wrap;color:var(--muted);font-size:13px}
.stats b{color:var(--ink);font-family:var(--f-mono);font-variant-numeric:tabular-nums;font-weight:500}
table.rt td{vertical-align:top;white-space:normal}
table.rt .nm{font-weight:600}
table.rt .cd{font-family:var(--f-mono);font-size:12px;color:var(--muted);white-space:nowrap}
table.rt .num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
table.rt .acts{justify-content:flex-end;flex-wrap:nowrap}
table.rt tr:hover td{background:var(--bg)}
.req{color:var(--busy)}
.rsel{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:6px 8px;min-width:140px}
.rsel:disabled{opacity:.6}
.hint{font-size:12px;color:var(--muted)}
.ferr{font-size:12px;color:var(--busy)}
.check{display:flex;gap:8px;align-items:flex-start;font-size:14px}
.denied{max-width:460px;margin:6vh auto 0;text-align:center}
@media (max-width:680px){
  table.rt thead{display:none}
  table.rt tr{display:grid;grid-template-columns:1fr auto;gap:2px 12px;padding:12px 0;border-top:1px solid var(--line)}
  table.rt td{border:0;padding:0}
  table.rt td.c-room{grid-column:1}
  table.rt td.c-act{grid-column:2;grid-row:1 / span 3;align-self:center}
  table.rt td.c-act .acts{flex-direction:column;align-items:stretch}
  table.rt td.c-loc,table.rt td.c-cap,table.rt td.c-eq,table.rt td.c-bk{grid-column:1;font-size:13px;color:var(--muted)}
  table.rt td.c-cap:not(:empty)::after{content:" ที่นั่ง"}
  table.rt td.c-bk:not(:empty)::before{content:"การจองที่จะถึง: "}
  table.rt tr:hover td{background:none}
}
.prov{display:grid;grid-template-columns:auto 1fr;gap:18px;align-items:center}
.prov .qrbox img,.prov .qrbox canvas{width:220px;height:220px}
@media (max-width:560px){.prov{grid-template-columns:1fr;justify-items:center;text-align:center}}
.login{max-width:420px;margin:8vh auto 0}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--plate);color:var(--plate-ink);padding:10px 16px;border-radius:999px;font-size:14px;z-index:40;max-width:calc(100% - 32px)}
@media (max-width:520px){.head h1{font-size:22px}.placard h1{font-size:24px}.tabs{margin-left:0}
  .item{grid-template-columns:auto 1fr}.item .acts{grid-column:2;justify-content:flex-start}}
@media (prefers-reduced-motion:no-preference){.room,.tab,.btn{transition:border-color .15s,background .15s,color .15s}}
</style>
</head>
<body>
<header class="bar"><div class="wrap">
  <div class="brand"><span class="mark"><svg viewBox="0 0 24 24" fill="none" stroke="var(--plate-ink)" stroke-width="2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><path d="M14 14h3v3h-3zM20 14v.01M14 20h.01M17 20h4v-3"/></svg></span><span id="appname">จองห้องเรียน</span></div>
  <nav class="tabs" id="tabs" hidden>
    <button class="tab" data-go="" id="t-rooms">ห้องทั้งหมด</button>
    <button class="tab" data-go="mine" id="t-mine">การจองของฉัน</button>
    <button class="tab admin" data-go="admin-rooms" id="t-admin-rooms" hidden>จัดการห้อง</button>
    <button class="tab admin" data-go="devices" id="t-devices" hidden>เครื่องหน้าห้อง</button>
    <button class="tab admin" data-go="users" id="t-users" hidden>ผู้ใช้</button>
    <button class="tab" id="t-logout">ออกจากระบบ</button>
  </nav>
</div></header>
<main class="wrap" id="view"></main>
<div id="modal"></div>
<div class="toast" id="toast" hidden></div>

<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script>
"use strict";
const CFG = window.ROOMBOOK || {};
const ROLE_LABEL = { student: "นักศึกษา", teacher: "อาจารย์", admin: "ผู้ดูแลระบบ" };
function limitText(role = S.me?.role) {
  const st = S.settings;
  if (role === "admin") return "ผู้ดูแลจองได้ไม่จำกัดระยะเวลา";
  const h = role === "teacher" ? st.teacher_max_hours || 8 : st.max_hours || 4;
  const d = role === "teacher" ? st.teacher_max_days_ahead || 120 : st.max_days_ahead || 30;
  return `จองได้ครั้งละไม่เกิน ${h} ชั่วโมง ล่วงหน้าไม่เกิน ${d} วัน`;
}
const PURPOSES = ["เรียนชดเชย","ติว / อ่านหนังสือกลุ่ม","สอบ / สอบย่อย","ทำงานกลุ่ม / โปรเจกต์","กิจกรรมชมรม / สโมสร","สัมมนา / บรรยายพิเศษ"];
const sb = window.supabase.createClient(CFG.SUPABASE_URL, CFG.SUPABASE_KEY, { auth: { flowType: "pkce", persistSession: true, detectSessionInUrl: true } });
const S = { session:null, me:null, admin:false, ready:false, rooms:[], bookings:[], profiles:{}, devices:[], checkins:[], users:[], invites:[],
            settings:{}, date:todayStr(), building:"ทั้งหมด", flash:null, prov:null };
let DAY_START = 7, DAY_END = 21;

/* ---------------- helpers ---------------- */
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function pad(n) { return String(n).padStart(2, "0"); }
function todayStr(d = new Date()) { return d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate()); }
function hmOf(d) { return pad(d.getHours()) + ":" + pad(d.getMinutes()); }
function nowHM() { return hmOf(new Date()); }
function toMin(hm) { const [h, m] = hm.split(":").map(Number); return h * 60 + m; }
function minToHM(m) { return pad(Math.floor(m / 60)) + ":" + pad(m % 60); }
function pct(hm) { const m = Math.min(Math.max(toMin(hm), DAY_START * 60), DAY_END * 60); return (m - DAY_START * 60) / ((DAY_END - DAY_START) * 60) * 100; }
const TH_DAYS = ["อา.","จ.","อ.","พ.","พฤ.","ศ.","ส."], TH_MON = ["ม.ค.","ก.พ.","มี.ค.","เม.ย.","พ.ค.","มิ.ย.","ก.ค.","ส.ค.","ก.ย.","ต.ค.","พ.ย.","ธ.ค."];
function thDate(ds) { const [y, m, d] = ds.split("-").map(Number); const dt = new Date(y, m - 1, d); return `${TH_DAYS[dt.getDay()]} ${d} ${TH_MON[m - 1]} ${y + 543}`; }
function ago(iso) {
  if (!iso) return "ไม่เคยเชื่อมต่อ";
  const s = (Date.now() - new Date(iso)) / 1000;
  if (s < 90) return "เมื่อสักครู่"; if (s < 3600) return Math.round(s / 60) + " นาทีที่แล้ว";
  if (s < 86400) return Math.round(s / 3600) + " ชั่วโมงที่แล้ว"; return Math.round(s / 86400) + " วันที่แล้ว";
}
function toast(t) { const el = $("#toast"); el.textContent = t; el.hidden = false; clearTimeout(toast._t); toast._t = setTimeout(() => el.hidden = true, 2800); }
function roomLink(id) { return location.origin + location.pathname + "#room-" + id; }
function facts(r) { return [r.building, r.floor, r.capacity ? r.capacity + " ที่นั่ง" : ""].filter(Boolean).map(esc).join(" · "); }
function dbError(e) {
  if (!e) return "เกิดข้อผิดพลาด ลองอีกครั้ง";
  if (e.code === "23P01") return "ช่วงเวลานี้มีคนจองแล้ว เลือกช่วงเวลาอื่น";
  if (e.code === "23505") return "ข้อมูลนี้มีอยู่แล้ว (ชื่อสั้นของห้องต้องไม่ซ้ำ)";
  if (e.code === "23514") return "ข้อมูลไม่ถูกต้อง ตรวจรูปแบบอีกครั้ง (ชื่อสั้นใช้ A–Z 0–9 - . _ ได้ไม่เกิน 16 ตัว)";
  if (e.code === "P0001") return e.message;
  if (e.code === "42501") return "บัญชีนี้ไม่มีสิทธิ์ทำรายการนี้";
  const m = String(e.message || "").toLowerCase();
  if (m.includes("database error saving new user") || m.includes("ยังไม่ได้ลงทะเบียน"))
    return "อีเมลนี้ยังไม่ได้ลงทะเบียนในระบบ ติดต่อผู้ดูแลระบบเพื่อขอสิทธิ์ใช้งาน";
  if (m.includes("rate limit")) return "ระบบส่งอีเมลเกินจำนวนที่อนุญาตชั่วคราว รอสักครู่แล้วลองใหม่ หรือดูลิงก์ที่ส่งไปก่อนหน้าในกล่องอีเมล (รวมถึงโฟลเดอร์สแปม)";
  if (m.includes("not authorized") || m.includes("signups not allowed")) return "อีเมลนี้ยังไม่ได้รับอนุญาตให้เข้าใช้ระบบ ติดต่อผู้ดูแลระบบ";
  if (m.includes("ใช้ได้เฉพาะอีเมล")) return e.message;
  return e.message || "เกิดข้อผิดพลาด ลองอีกครั้ง";
}
function mapBooking(b) {
  const s = new Date(b.starts_at), e = new Date(b.ends_at);
  return { ...b, date: todayStr(s), start: hmOf(s), end: (todayStr(e) !== todayStr(s) ? "24:00" : hmOf(e)) };
}
function bookingsFor(roomId, date) { return S.bookings.filter(b => b.room_id === roomId && b.date === date).sort((a, b) => a.start.localeCompare(b.start)); }
function statusNow(roomId) {
  const t = nowHM(), list = bookingsFor(roomId, todayStr());
  const cur = list.find(b => b.start <= t && t < b.end);
  if (cur && cur.status === "checked_in") return { cls: "busy", label: "ใช้งานอยู่ ถึง " + cur.end };
  if (cur) return { cls: "wait", label: "รอเช็กอิน " + cur.start + "–" + cur.end };
  const next = list.find(b => b.start > t);
  return { cls: "free", label: next ? "ว่าง ถึง " + next.start : "ว่างทั้งวัน" };
}
function timeline(roomId, date, big) {
  const blks = bookingsFor(roomId, date).map(b => {
    const cls = b.user_id === S.session?.user.id ? "mine" : (b.status === "checked_in" ? "in" : "");
    return `<div class="blk ${cls}" style="left:${pct(b.start)}%;width:${pct(b.end) - pct(b.start)}%" title="${esc(b.start + "–" + b.end + " " + b.title)}"></div>`;
  }).join("");
  let now = "";
  if (date === todayStr()) { const t = nowHM(); if (toMin(t) >= DAY_START * 60 && toMin(t) <= DAY_END * 60) now = `<div class="now" style="left:${pct(t)}%"></div>`; }
  let ticks = ""; const step = big ? 2 : 4;
  for (let h = DAY_START; h <= DAY_END; h += step) ticks += `<span style="left:${pct(pad(h) + ":00")}%">${pad(h)}:00</span>`;
  return `<div class="tl${big ? " big" : ""}"><div class="track" ${big ? 'id="bigtrack"' : ""}>${blks}${now}</div><div class="ticks">${ticks}</div></div>`;
}
function makeQR(el, text, size) {
  el.innerHTML = "";
  new QRCode(el, { text, width: size, height: size, colorDark: "#000000", colorLight: "#ffffff", correctLevel: QRCode.CorrectLevel.M });
}

/* ---------------- data ---------------- */
async function loadAll() {
  const start = new Date(); start.setHours(0, 0, 0, 0);
  const [r, b, st] = await Promise.all([
    sb.from("rooms").select("*").order("sort").order("name"),
    sb.from("bookings").select("id,room_id,user_id,starts_at,ends_at,title,purpose,status,checked_in_at")
      .gte("ends_at", start.toISOString()).in("status", ["booked", "checked_in"]).order("starts_at").limit(3000),
    sb.from("app_settings").select("key,value"),
  ]);
  if (r.error || b.error) { S.loadError = dbError(r.error || b.error); render(); return; }
  S.loadError = null;
  S.rooms = r.data; S.bookings = b.data.map(mapBooking);
  S.settings = Object.fromEntries((st.data || []).map(x => [x.key, x.value]));
  DAY_START = parseInt(S.settings.open_time || "07", 10); DAY_END = Math.ceil(toMin(S.settings.close_time || "21:00") / 60);
  const ids = [...new Set(S.bookings.map(x => x.user_id))].filter(id => !S.profiles[id]);
  if (ids.length) {
    const p = await sb.from("profiles").select("id,display_name,role").in("id", ids);
    (p.data || []).forEach(x => S.profiles[x.id] = x);
  }
  if (S.admin) {
    const [d, c, pr, inv] = await Promise.all([
      sb.from("devices").select("*").order("created_at"),
      sb.from("checkins").select("*").order("at", { ascending: false }).limit(40),
      sb.from("profiles").select("id,email,display_name,role,created_at").order("created_at"),
      sb.from("role_invites").select("*").order("created_at"),
    ]);
    S.devices = d.data || []; S.checkins = c.data || [];
    S.users = pr.data || []; S.invites = inv.data || [];
    S.users.forEach(u => S.profiles[u.id] = u);
  }
  S.ready = true;
  render();
  // QR เช็กอินที่เปิดอยู่: เปลี่ยนเป็น "เช็กอินแล้ว" ทันทีเมื่อเครื่องหน้าห้องตรวจผ่าน
  if (S.qrOpen && renderQRSheet.token) {
    const bk = S.bookings.find(x => x.id === S.qrOpen);
    if (bk && bk.status !== renderQRSheet.lastStatus) renderQRSheet(renderQRSheet.token);
  }
}
let reloadTimer = null;
function scheduleReload() { clearTimeout(reloadTimer); reloadTimer = setTimeout(loadAll, 400); }

async function startSession(session) {
  S.session = session;
  if (!session) { S.me = null; S.admin = false; render(); return; }
  const p = await sb.from("profiles").select("*").eq("id", session.user.id).maybeSingle();
  S.me = p.data; S.admin = p.data?.role === "admin";
  S.noAccess = !p.data || !ROLE_LABEL[p.data.role];
  if (S.noAccess) { render(); return; }
  try { const back = localStorage.getItem("rb_after_login"); if (back) { localStorage.removeItem("rb_after_login"); if (!location.hash) location.hash = back; } } catch (_) {}
  sb.channel("rb-live")
    .on("postgres_changes", { event: "*", schema: "public", table: "bookings" }, scheduleReload)
    .on("postgres_changes", { event: "*", schema: "public", table: "rooms" }, scheduleReload)
    .on("postgres_changes", { event: "*", schema: "public", table: "devices" }, scheduleReload)
    .subscribe();
  await loadAll();
}

/* ---------------- routing ---------------- */
function route() {

  if (["mine", "admin-rooms", "devices", "users"].includes(h)) return { v: h };
  return { v: "rooms" };
}
function go(h) { if (location.hash.slice(1) === h) render(); else location.hash = h; window.scrollTo(0, 0); }
window.addEventListener("hashchange", () => { S.flash = null; render(); });
$("#tabs").addEventListener("click", async e => {

function saveDraft(id) { if (!$("#f-title")) return; renderRoom.draft = { id, title: $("#f-title").value, purpose: $("#f-purpose").value, start: $("#f-start").value, end: $("#f-end").value }; }
async function book(room) {
  const title = $("#f-title").value.trim(), purpose = $("#f-purpose").value, start = $("#f-start").value, end = $("#f-end").value, date = S.date;
  const fail = t => { S.flash = { kind: "err", text: t }; saveDraft(room.id); render(); };
  if (!title) return fail("ใส่ชื่อวิชาหรือกิจกรรมก่อนจอง");

function downloadPlacard(id) {
  const r = S.rooms.find(x => x.id === id), src = document.querySelector("#placard-qr canvas");
  if (!src) return;
  const W = 1240, H = 1754, c = document.createElement("canvas"); c.width = W; c.height = H; const x = c.getContext("2d");
  x.fillStyle = "#ffffff"; x.fillRect(0, 0, W, H); x.fillStyle = "#14222A"; x.fillRect(0, 0, W, 300);
  x.fillStyle = "#EEF2F3"; x.textAlign = "center";
  x.font = "600 52px 'Bai Jamjuree','IBM Plex Sans Thai',sans-serif"; x.fillText(r.building || "ห้องเรียน", W / 2, 110, W - 120);
  x.font = "700 110px 'Bai Jamjuree','IBM Plex Sans Thai',sans-serif"; x.fillText(r.name, W / 2, 240, W - 120);
  x.fillStyle = "#14222A"; x.font = "500 46px 'IBM Plex Sans Thai',sans-serif";
  x.fillText([r.floor, r.capacity ? r.capacity + " ที่นั่ง" : ""].filter(Boolean).join(" · "), W / 2, 400, W - 120);
  x.imageSmoothingEnabled = false; x.drawImage(src, (W - 860) / 2, 480, 860, 860);
  x.font = "700 72px 'Bai Jamjuree','IBM Plex Sans Thai',sans-serif"; x.fillText("สแกนเพื่อดูตารางและจองห้องนี้", W / 2, 1480, W - 120);
  x.fillStyle = "#586972"; x.font = "400 38px 'IBM Plex Sans Thai',sans-serif"; x.fillText("เช็กอินด้วย QR การจองที่เครื่องหน้าห้อง", W / 2, 1560);
  c.toBlob(b => { const a = document.createElement("a"); a.href = URL.createObjectURL(b); a.download = `QR-${r.code}.png`; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 2000); }, "image/png");
}

        <td class="c-loc">${adm ? `<span class="chip busy">ผู้ดูแลระบบ</span>` : `<select class="rsel" data-role="${esc(u.email || "")}" aria-label="สิทธิ์ของ ${esc(u.email || "")}">${opts(u.role)}</select>`}</td>
        <td class="c-eq num">${u.created_at ? thDate(todayStr(new Date(u.created_at))) : ""}</td>
        <td class="c-act">${adm ? `<span class="hint">แก้ผ่านฐานข้อมูล</span>` : `<span data-slot><button class="btn danger" data-remove="${esc(u.email || "")}">ถอนสิทธิ์</button></span>`}</td></tr>`; }).join("")}</tbody></table></div>`
      : `<p class="empty">${S.users.length ? "ไม่พบผู้ใช้ที่ตรงกับการค้นหา" : "ยังไม่มีผู้ใช้"}</p>`;
  };
  draw();
  $("#u-q").oninput = e => { UR.q = e.target.value; draw(); };
  $("#u-filter").onchange = e => { UR.role = e.target.value; draw(); };
  $("#u-emails").oninput = e => { const n = parseEmails(e.target.value).length; $("#u-count").textContent = n > 1 ? `${n} อีเมล` : ""; };
  const setRole = (email, role) => sb.rpc("set_user_role", { p_email: email, p_role: role });
  $("#uf").onsubmit = async e => {
    e.preventDefault();
    const emails = parseEmails($("#u-emails").value), role = $("#u-role").value;
    if (!emails.length) { $("#u-result").innerHTML = `<div class="msg err">ใส่อีเมลอย่างน้อย 1 รายการ</div>`; return; }
    const btn = $("#u-save"); btn.disabled = true;
    const done = { updated: [], invited: [] }, failed = [], failedEmails = [];
    for (let i = 0; i < emails.length; i++) {
      btn.textContent = `กำลังบันทึก ${i + 1}/${emails.length}…`;
      const { data, error } = await setRole(emails[i], role);
      if (error) { failed.push(`${emails[i]}: ${dbError(error)}`); failedEmails.push(emails[i]); } else (done[data] || done.updated).push(emails[i]);
    }
    const parts = [];
    if (done.invited.length) parts.push(`ลงทะเบียนเป็น${ROLE_LABEL[role]} ${done.invited.length} คน (เข้าใช้ได้เมื่อล็อกอินครั้งแรก)`);
    if (done.updated.length) parts.push(`เปลี่ยนเป็น${ROLE_LABEL[role]} ${done.updated.length} คน`);
    await loadAll();
    $("#u-result").innerHTML = (parts.length ? `<div class="msg ok">${esc(parts.join(" · "))}</div>` : "")
      + (failed.length ? `<div class="msg err" style="margin-top:8px">ไม่สำเร็จ ${failed.length} รายการ:<br>${failed.map(esc).join("<br>")}</div>` : "");
    $("#u-emails").value = failedEmails.join("\n");   // เก็บเฉพาะอีเมลที่ไม่สำเร็จไว้ให้แก้แล้วลองใหม่
  };
  V.onchange = async e => {
    const s = e.target.closest("[data-role]"); if (!s) return;
    const { error } = await setRole(s.dataset.role, s.value);
    toast(error ? dbError(error) : `เปลี่ยน ${s.dataset.role} เป็น${ROLE_LABEL[s.value]}แล้ว`); loadAll();
  };
  V.onclick = async e => {
    const r = e.target.closest("[data-remove]");
    if (r) { r.parentElement.innerHTML = `<span class="confirm">ถอนสิทธิ์และยกเลิกการจองที่ยังไม่ถึงเวลา? <button class="btn danger" data-remove-yes="${esc(r.dataset.remove)}">ยืนยัน</button><button class="btn ghost small" data-no>ไม่</button></span>`; return; }
    const y = e.target.closest("[data-remove-yes]");
    if (y) { const { error } = await setRole(y.dataset.removeYes, "none"); toast(error ? dbError(error) : `ถอนสิทธิ์ ${y.dataset.removeYes} แล้ว`); loadAll(); return; }
    if (e.target.closest("[data-no]")) render();
  };
}

/* ---------------- admin: devices ---------------- */
function renderDevices(V) {
  const roomName = id => (S.rooms.find(r => r.id === id) || {}).name || "ไม่ได้ผูก";
  const online = d => d.last_seen && Date.now() - new Date(d.last_seen) < 3 * 60 * 1000;
  const P = S.prov;
  const resChip = { OK: "free", TOO_EARLY: "wait", LATE: "wait", WRONG_ROOM: "busy", INVALID: "busy", NOT_ACTIVE: "busy", ENDED: "mute" };
  const resLabel = { OK: "ผ่าน", TOO_EARLY: "มาก่อนเวลา", LATE: "เลยเวลา", WRONG_ROOM: "ผิดห้อง", INVALID: "QR ไม่ถูกต้อง", NOT_ACTIVE: "ถูกยกเลิกแล้ว", ENDED: "หมดเวลา" };
  V.innerHTML = `<div class="head"><div><h1>เครื่องหน้าห้อง</h1><p class="sub">ผูกเครื่องสแกนกับห้อง ดูสถานะออนไลน์ และประวัติการเช็กอิน</p></div></div>
  <section class="panel"><h2>ผูกเครื่องใหม่ / ย้ายห้อง</h2>
    ${P ? `<div class="prov"><div class="qrbox" id="provqr"></div><div style="display:flex;flex-direction:column;gap:10px">
        <div><div class="eyebrow">QR ตั้งค่าสำหรับ</div><h3>${esc(roomName(P.room_id))}</h3></div>
        ${P.used ? `<div class="msg ok">ผูกเครื่อง ${esc(P.used)} สำเร็จ</div>`
          : `<p class="sub" style="margin:0">ยื่น QR นี้ให้เครื่องหน้าห้องสแกน ใช้ได้ครั้งเดียว หมดอายุใน <b id="prov-left"></b></p>
             <p class="sub" style="margin:0;font-size:13px">QR นี้มีรหัส Wi-Fi อยู่ด้วย อย่าแชร์หรือถ่ายเก็บไว้</p>`}
        <button class="btn ghost small" id="prov-close" style="align-self:flex-start">${P.used ? "เสร็จ" : "ยกเลิก"}</button></div></div>`
    : `<form id="pf" class="row">
      <div class="field" style="flex-basis:200px"><label for="p-room">ห้อง</label><select id="p-room" required>${S.rooms.map(r => `<option value="${esc(r.id)}">${esc(r.name)} (${esc(r.code)})</option>`).join("")}</select></div>
      <div class="field"><label for="p-ssid">ชื่อ Wi-Fi (ESP32)</label><input id="p-ssid" maxlength="32" placeholder="ไม่ต้องใส่ถ้าเป็น Raspberry Pi"></div>
      <div class="field"><label for="p-pass">รหัส Wi-Fi</label><input id="p-pass" type="password" maxlength="63" autocomplete="off"></div>
      <button class="btn" type="submit" ${S.rooms.length ? "" : "disabled"}>สร้าง QR ตั้งค่า</button></form>
      <p class="sub" style="margin:0;font-size:13px">ใช้ได้ทั้งเครื่องใหม่และเครื่องเดิมที่จะย้ายห้อง ESP32 รองรับ Wi-Fi แบบรหัสผ่าน (WPA2-Personal) เท่านั้น</p>`}
  </section>
  <section class="panel"><h2>เครื่องทั้งหมด (${S.devices.length})</h2>
    ${S.devices.length ? `<div class="tablewrap"><table><thead><tr><th>สถานะ</th><th>ห้อง</th><th>รหัสเครื่อง</th><th>ชนิด</th><th>เฟิร์มแวร์</th><th></th></tr></thead><tbody>
      ${S.devices.map(d => `<tr><td><span class="chip ${online(d) ? "free" : "busy"}">${online(d) ? "ออนไลน์" : "ออฟไลน์"}</span> <small class="facts">${esc(ago(d.last_seen))}</small></td>
        <td>${esc(roomName(d.room_id))}</td><td class="mono">${esc(d.id)}</td><td>${d.kind === "pi" ? "Raspberry Pi" : "ESP32"}</td><td class="mono">${esc(d.fw || "")}</td>
        <td><span data-slot><button class="btn danger" data-unbind="${esc(d.id)}">ถอดออก</button></span></td></tr>`).join("")}</tbody></table></div>`
    : `<p class="empty">ยังไม่มีเครื่อง · สร้าง QR ตั้งค่าด้านบน แล้วนำไปสแกนที่เครื่อง</p>`}
  </section>
  <section class="panel"><h2>เช็กอินล่าสุด</h2>
    ${S.checkins.length ? `<div class="tablewrap"><table><thead><tr><th>เวลา</th><th>ห้อง</th><th>ผล</th><th>เครื่อง</th></tr></thead><tbody>
      ${S.checkins.map(c => { const t = new Date(c.at); return `<tr><td class="mono">${todayStr(t) === todayStr() ? "" : t.getDate() + "/" + (t.getMonth() + 1) + " "}${hmOf(t)}</td><td>${esc(roomName(c.room_id))}</td>
        <td><span class="chip ${resChip[c.result] || "mute"}">${esc(resLabel[c.result] || c.result)}</span></td><td class="mono">${esc(c.device_id || "")}</td></tr>`; }).join("")}</tbody></table></div>`
    : `<p class="empty">ยังไม่มีการเช็กอิน</p>`}
  </section>`;
  if (P) {
    const q = { t: "RBPROV", v: 1, u: CFG.SUPABASE_URL, k: CFG.SUPABASE_KEY, c: P.code };
    if (P.ssid) { q.w = P.ssid; q.p = P.pass; }
    makeQR($("#provqr"), JSON.stringify(q), 260);
    $("#prov-close").onclick = () => { stopProvWatch(); S.prov = null; render(); };
    tickProv();
  } else {
    const f = $("#pf");
    f.onsubmit = async e => {
      e.preventDefault();
      const { data, error } = await sb.rpc("create_provisioning_code", { p_room: $("#p-room").value });
      if (error) { toast(dbError(error)); return; }
      S.prov = { code: data.code, room_id: data.room_id, expires: new Date(data.expires_at), ssid: $("#p-ssid").value.trim(), pass: $("#p-pass").value };
      startProvWatch(); render();
    };
  }
  V.onclick = async e => {
    const u = e.target.closest("[data-unbind]");
    if (u) { u.parentElement.innerHTML = `<span class="confirm">ถอดเครื่องนี้? <button class="btn danger" data-unyes="${esc(u.dataset.unbind)}">ถอด</button><button class="btn ghost small" data-no>ไม่</button></span>`; return; }
    const y = e.target.closest("[data-unyes]");
    if (y) { const { error } = await sb.from("devices").delete().eq("id", y.dataset.unyes); if (error) toast(dbError(error)); else { toast("ถอดเครื่องแล้ว เครื่องจะกลับไปหน้ารอตั้งค่า"); loadAll(); } return; }
    if (e.target.closest("[data-no]")) render();
  };
}
let provTimer = null;
function startProvWatch() {
  stopProvWatch();
  provTimer = setInterval(async () => {
    if (!S.prov || S.prov.used) return stopProvWatch();
    const { data } = await sb.from("provisioning_codes").select("used_at,used_by").eq("code", S.prov.code).maybeSingle();
    if (data && data.used_at) { S.prov.used = data.used_by; S.prov.pass = ""; stopProvWatch(); toast("ผูกเครื่องสำเร็จ"); loadAll(); return; }
    tickProv();
  }, 3000);
}
function stopProvWatch() { clearInterval(provTimer); provTimer = null; }
function tickProv() {
  const el = $("#prov-left"); if (!el || !S.prov) return;
  const s = Math.max(0, Math.round((S.prov.expires - Date.now()) / 1000));
  el.textContent = s ? `${Math.floor(s / 60)}:${pad(s % 60)} นาที` : "หมดอายุแล้ว สร้างใหม่";
}

/* ---------------- boot ---------------- */
render();
sb.auth.getSession().then(({ data }) => startSession(data.session));
sb.auth.onAuthStateChange((ev, session) => {
  if (ev === "SIGNED_IN" && (!S.session || S.session.user.id !== session.user.id)) startSession(session);
  if (ev === "SIGNED_OUT") { S.noAccess = false; S.session = null; S.ready = false; S.loginSent = null; render(); }
});
setInterval(() => {   // อัปเดตสถานะ "ตอนนี้" ทุกนาที โดยไม่ล้างฟอร์มที่กำลังพิมพ์
  const r = route().v;
  if (S.ready && (r === "rooms" || (r === "room" && !document.activeElement.closest("form")))) { if (r === "room") saveDraft(route().id); render(); }
  if (S.qrOpen && renderQRSheet.token) renderQRSheet(renderQRSheet.token);
}, 60000);
</script>
